<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>เข้าเรียน | 101 Future Academy</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-body">
    <header class="topbar">
      <a class="brand" href="/" aria-label="101 Future Academy">
        <span class="brand-mark">101</span>
        <span class="brand-name">Future Academy</span>
      </a>
      <nav class="nav" aria-label="Learning navigation">
        <a href="/">หน้าแรก</a>
        <a href="/#apply">สมัครเรียน</a>
      </nav>
    </header>

    <main class="admin-main learn-main">
      <section class="login-card access-card">
        <div>
          <p class="eyebrow">เข้าเรียน</p>
          <h2>เข้าเรียน</h2>
          <p>กรอกเลขสมัคร เบอร์โทร และรหัสเข้าเรียนที่ได้รับหลังชำระเงิน ระบบจะตรวจสอบสิทธิ์ก่อนเปิดบทเรียน</p>
        </div>
        <form id="accessForm" class="access-form">
          <label>
            เลขสมัคร
            <input name="enrollmentId" autocomplete="off" required />
          </label>
          <label>
            เบอร์โทร
            <input name="phone" inputmode="tel" autocomplete="tel" required />
          </label>
          <label>
            รหัสเข้าเรียน
            <input name="accessCode" autocomplete="off" required />
          </label>
          <button class="button primary" type="submit">เปิดบทเรียน</button>
          <p id="accessStatus" role="status"></p>
        </form>
      </section>

      <section id="lessonPanel" class="lesson-panel hidden" aria-live="polite">
        <div>
          <p class="eyebrow">บทเรียนของคุณ</p>
          <h2 id="courseTitle">บทเรียน</h2>
          <p id="expiryText"></p>
        </div>
        <div id="lessonList" class="lesson-grid"></div>
      </section>
    </main>
    <script src="/learn.js" defer></script>
  </body>
</html>
