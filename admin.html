<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>101 Future Admin</title>
    <link rel="stylesheet" href="/styles.css?v=20260530-interest-admin" />
  </head>
  <body class="admin-body">
    <header class="topbar">
      <a class="brand" href="/" aria-label="101 Future Academy">
        <span class="brand-mark">101</span>
        <span class="brand-name">Future Admin</span>
      </a>
      <nav class="nav" aria-label="Admin navigation">
        <a href="/">หน้าเว็บ</a>
        <a href="/api/leads.csv" id="exportLink">Export CSV</a>
      </nav>
    </header>

    <main class="admin-main">
      <section id="loginPanel" class="login-card">
        <div>
          <p class="eyebrow">Admin</p>
          <h2>Lead CRM</h2>
        </div>
        <label>
          Admin token
          <input id="tokenInput" type="password" autocomplete="current-password" />
        </label>
        <button id="loginButton" class="button primary">เข้าสู่ระบบ</button>
        <p id="loginStatus" role="status"></p>
      </section>

      <section id="adminPanel" class="admin-shell hidden">
        <div class="admin-toolbar">
          <div>
            <p class="eyebrow">Dashboard</p>
            <h2>ผู้สมัครเรียน</h2>
          </div>
          <div class="toolbar-actions">
            <button id="refreshButton" class="button secondary">Refresh</button>
          </div>
        </div>

        <div id="metrics" class="metric-grid"></div>
        <section class="payment-panel" aria-labelledby="interestTitle">
          <div>
            <p class="eyebrow">LINE Interest</p>
            <h3 id="interestTitle">คนที่ลงชื่อสนใจผ่าน LINE</h3>
          </div>
          <div id="interestList" class="payment-grid"></div>
        </section>
        <section class="payment-panel" aria-labelledby="paymentTitle">
          <div>
            <p class="eyebrow">ตรวจการชำระเงิน</p>
            <h3 id="paymentTitle">เคสที่ต้องดูแล</h3>
          </div>
          <div id="paymentList" class="payment-grid"></div>
        </section>
        <div id="leadList" class="lead-list"></div>
      </section>
    </main>
    <script src="/admin.js?v=20260530-interest-admin" defer></script>
  </body>
</html>
