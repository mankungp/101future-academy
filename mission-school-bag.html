<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pack My School Bag | 101 Future Academy</title>
    <link rel="stylesheet" href="/styles.css?v=20260530-mission-page-4" />
  </head>
  <body class="mission-body">
    <header class="mission-topbar">
      <a class="brand" href="/learn" aria-label="กลับหน้าเรียน 101 Future Academy">
        <span class="brand-mark">101</span>
        <span class="brand-name">Future Academy</span>
      </a>
      <a class="button secondary mission-exit-link" href="/learn">
        <span class="exit-full">ออกจาก Mission</span>
        <span class="exit-short">ออก</span>
      </a>
    </header>

    <main class="mission-main">
      <section class="mission-screen" aria-live="polite">
        <div class="mission-screen-head">
          <div>
            <p class="eyebrow">English Mission · ป.1</p>
            <h1>Pack My School Bag</h1>
            <p>ฟังคำสั่ง แล้วแตะหรือหยิบของใส่กระเป๋าให้ถูก</p>
          </div>
          <div class="mission-score mission-score-large">
            <span id="missionStars">0/4</span>
            <strong>stars</strong>
          </div>
        </div>

        <div class="mission-prompt mission-prompt-large">
          <button id="missionSoundButton" class="sound-button" type="button" aria-label="ฟังคำสั่ง">Listen</button>
          <div>
            <span>ฟังแล้วแตะของที่ถูกต้อง</span>
            <p id="missionPromptText">Tap the book.</p>
          </div>
        </div>

        <div id="missionFeedback" class="mission-feedback mission-feedback-large">
          เริ่มจากคำว่า book
        </div>

        <div id="correctBurst" class="correct-burst hidden" aria-live="assertive">
          <div class="correct-burst-card">
            <span class="burst-confetti" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </span>
            <span class="mini-label">Yes, correct</span>
            <strong>ถูกต้อง</strong>
            <span id="correctBurstWord">book = หนังสือ</span>
          </div>
        </div>

        <div class="mission-stage mission-stage-full">
          <div id="missionBag" class="school-bag school-bag-large" aria-label="school bag">
            <span>school bag</span>
            <div id="packedItems" class="packed-items"></div>
          </div>

          <div id="missionItems" class="mission-items mission-items-large" aria-label="school items">
            <button class="mission-item mission-object" type="button" draggable="true" data-word="book" data-thai="หนังสือ">
              <img class="object-image" src="/assets/school-bag/book.svg" alt="" />
              <strong>book</strong>
              <small>หนังสือ</small>
            </button>
            <button class="mission-item mission-object" type="button" draggable="true" data-word="pencil" data-thai="ดินสอ">
              <img class="object-image" src="/assets/school-bag/pencil.svg" alt="" />
              <strong>pencil</strong>
              <small>ดินสอ</small>
            </button>
            <button class="mission-item mission-object" type="button" draggable="true" data-word="ruler" data-thai="ไม้บรรทัด">
              <img class="object-image" src="/assets/school-bag/ruler.svg" alt="" />
              <strong>ruler</strong>
              <small>ไม้บรรทัด</small>
            </button>
            <button class="mission-item mission-object" type="button" draggable="true" data-word="eraser" data-thai="ยางลบ">
              <img class="object-image" src="/assets/school-bag/eraser.svg" alt="" />
              <strong>eraser</strong>
              <small>ยางลบ</small>
            </button>
          </div>
        </div>

        <div id="missionComplete" class="result-card mission-complete hidden"></div>
      </section>
    </main>

    <script src="/mission-school-bag.js?v=20260530-mission-page-4" defer></script>
  </body>
</html>
